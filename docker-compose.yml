services:
  mongodb:
    image: mongo:7
    container_name: mongo-tp
    restart: unless-stopped
    volumes:
      - datos_mongo:/data/db

  backend:
    build: ./packages/backend
    container_name: backend-tp
    restart: unless-stopped
    environment:
      - SERVER_PORT=3000
    env_file:
      - ~/backend.env
    volumes:
      - ./docs:/docs:ro
    depends_on:
      - mongodb

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-tp
    restart: unless-stopped
    command: start-dev
    environment:
      # Usuario y contraseña para entrar al panel gráfico en http://tu-ip/auth/admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=adminTpCodigoAVoluntad5

      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
    volumes:
      - datos_keycloak:/opt/keycloak/data

  nginx:
    image: nginx:alpine
    container_name: nginx-tp
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - keycloak

volumes:
  datos_mongo:
  datos_keycloak:
