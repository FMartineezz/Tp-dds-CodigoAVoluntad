$kind: http-request
url: "{{baseUrl}}/colectivos"
method: POST
body:
  type: json
  content: |-
    {
      "nombre": "Colectivo Ambiental CABA",
      "descripcion": "Organización dedicada a promover el cuidado del medio ambiente y la sustentabilidad en la Ciudad de Buenos Aires.",
      "ubicacion": "caba",
      "tipoDeColectivo": "fundacion"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          const body = pm.response.json();
          pm.collectionVariables.set('colectivoId', String(body.id ?? body._id));
      }
    language: text/javascript
order: 2000
