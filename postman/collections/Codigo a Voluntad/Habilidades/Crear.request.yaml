$kind: http-request
url: "{{baseUrl}}/habilidades"
method: POST
body:
  type: json
  content: "{\r

    \    \"titulo\": \"Programación en JavaScript\",\r

    \    \"descripcion\": \"Capacidad para desarrollar aplicaciones web y lógica de negocio utilizando JS moderno.\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          const body = pm.response.json();
          pm.collectionVariables.set('habilidadId', String(body.id ?? body._id));
      }
    language: text/javascript
order: 2000
