$kind: http-request
url: "{{baseUrl}}/proyectos/{{proyectoId}}/logros"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "descripcion": "Backend implementado",
      "porcentaje": 40,
      "urlCodigoFuente": "https://github.com/usuario/proyecto"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          const body = pm.response.json();
          pm.collectionVariables.set('logroId', String(body.id ?? body._id));
      }
    language: text/javascript
order: 1000
