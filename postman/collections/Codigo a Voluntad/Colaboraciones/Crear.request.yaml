$kind: http-request
url: "{{baseUrl}}/colaboraciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "personaColaboradoraId": "{{colaboradoraId}}",
      "proyectoId": "{{proyectoId}}",
      "anonima": false
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          const body = pm.response.json();
          pm.collectionVariables.set('colaboracionId', String(body.id ?? body._id));
      }
    language: text/javascript
order: 2000
